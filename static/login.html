<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarkItDown — Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0e0e0e;
    color: #f0f0f0;
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box {
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    padding: 40px;
    width: 360px;
    background: #161616;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 32px;
    text-align: center;
  }
  .logo span { color: #e8ff47; }
  label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #666;
    margin-bottom: 6px;
    margin-top: 20px;
  }
  input {
    width: 100%;
    background: #0e0e0e;
    border: 1px solid #2a2a2a;
    border-radius: 3px;
    color: #f0f0f0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #525252; }
  button {
    margin-top: 28px;
    width: 100%;
    background: #e8ff47;
    border: none;
    border-radius: 3px;
    color: #0e0e0e;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 800;
    padding: 12px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    transition: background 0.15s;
  }
  button:hover { background: #b8cc2a; }
  .error {
    margin-top: 16px;
    color: #ff4d4d;
    font-size: 11px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="box">
  <div class="logo"><span>[</span>md<span>]</span> MarkItDown</div>
  <form method="POST" action="/login">
    <label>Username</label>
    <input type="text" name="username" autofocus autocomplete="username">
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password">
    <button type="submit">Sign In →</button>
  </form>
  <!--ERROR-->
</div>
</body>
</html>
